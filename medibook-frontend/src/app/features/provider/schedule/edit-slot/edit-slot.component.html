<div class="edit-slot-container">
  <!-- Header -->
  <div class="header">
    <button class="back-btn" (click)="goBack()">
      <mat-icon>arrow_back</mat-icon>
      <span>Back to Schedule</span>
    </button>
    <h1>Edit Slot</h1>
    <p>Modify the availability slot details</p>
  </div>

  <!-- Page Content -->
  <div class="page-content">
    <div class="form-card">
      <form (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label>Date</label>
          <input type="date" [(ngModel)]="slot.date" name="date" required class="form-input">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Start Time</label>
            <input type="time" [(ngModel)]="slot.startTime" name="startTime" required class="form-input">
          </div>

          <div class="form-group">
            <label>End Time</label>
            <input type="time" [(ngModel)]="slot.endTime" name="endTime" required class="form-input">
          </div>
        </div>

        <div class="actions">
          <button type="button" class="btn-danger" (click)="deleteSlot()">
            <mat-icon>delete</mat-icon>
            Delete
          </button>
          <div class="right-actions">
            <button type="button" class="btn-secondary" (click)="goBack()">Cancel</button>
            <button type="submit" class="btn-primary">Save Changes</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
