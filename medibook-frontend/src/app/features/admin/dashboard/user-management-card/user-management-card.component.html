<div class="user-management-card" [ngClass]="{'trend-positive': trend > 0, 'trend-negative': trend < 0, 'trend-neutral': trend === 0}">
  <div class="card-header">
    <div class="card-icon">
      <mat-icon>{{ icon }}</mat-icon>
    </div>
    <div class="card-info">
      <h3>{{ title }}</h3>
      <div class="stat-value">{{ count }}</div>
      <div class="stat-label">{{ title }}</div>
      <div class="trend-indicator" *ngIf="trend !== 0">
        <mat-icon class="trend-icon">{{ trendIcon }}</mat-icon>
        <span class="trend-text">{{ trendText }}</span>
      </div>
    </div>
  </div>
</div>
