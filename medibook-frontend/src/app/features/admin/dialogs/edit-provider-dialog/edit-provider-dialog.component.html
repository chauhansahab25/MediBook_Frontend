<div class="dialog-header">
  <h2 mat-dialog-title>Edit Provider</h2>
  <button mat-icon-button (click)="onCancel()" class="close-btn">
    <mat-icon>close</mat-icon>
  </button>
</div>

<mat-dialog-content class="dialog-content">
  <div *ngIf="error" class="error-message">
    <mat-icon>error</mat-icon>
    <span>{{ error }}</span>
  </div>

  <div class="form-container">
    <div class="form-field">
      <label>Provider ID</label>
      <input type="text" [value]="provider.providerId" disabled class="disabled-input">
    </div>

    <div class="form-field">
      <label>Name</label>
      <input type="text" [value]="provider.fullName" disabled class="disabled-input">
    </div>

    <div class="form-field">
      <label>Email</label>
      <input type="text" [value]="provider.email" disabled class="disabled-input">
    </div>

    <div class="form-field">
      <label>Specialization *</label>
      <input type="text" [(ngModel)]="provider.specialization" placeholder="e.g., Cardiologist" [disabled]="loading">
    </div>

    <div class="form-field">
      <label>Qualification *</label>
      <input type="text" [(ngModel)]="provider.qualification" placeholder="e.g., MBBS, MD" [disabled]="loading">
    </div>

    <div class="form-field">
      <label>Experience (Years) *</label>
      <input type="number" [(ngModel)]="provider.experienceYears" placeholder="0" min="0" [disabled]="loading">
    </div>

    <div class="form-field">
      <label>Bio</label>
      <textarea [(ngModel)]="provider.bio" placeholder="Brief description about the provider" rows="3" [disabled]="loading"></textarea>
    </div>

    <div class="form-field">
      <label>Clinic Name</label>
      <input type="text" [(ngModel)]="provider.clinicName" placeholder="Enter clinic name" [disabled]="loading">
    </div>

    <div class="form-field">
      <label>Clinic Address</label>
      <textarea [(ngModel)]="provider.clinicAddress" placeholder="Enter clinic address" rows="2" [disabled]="loading"></textarea>
    </div>
  </div>
</mat-dialog-content>

<mat-dialog-actions class="dialog-actions">
  <button class="btn-cancel" (click)="onCancel()" [disabled]="loading">Cancel</button>
  <button class="btn-save" (click)="onSave()" [disabled]="loading || !provider.specialization || !provider.qualification">
    <mat-icon *ngIf="loading" class="spinner">refresh</mat-icon>
    <span>{{ loading ? 'Saving...' : 'Save Changes' }}</span>
  </button>
</mat-dialog-actions>
